<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DeckCraft</title>
  
<script type="module">
import init, * as bindings from './deckcraft-web-3d451cd28e31e9b6.js';
const wasm = await init({ module_or_path: './deckcraft-web-3d451cd28e31e9b6_bg.wasm' });

window.wasmBindings = bindings;

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

// Notificar janela-mãe (Slide Killer Hub)
try {
  window.parent.postMessage({ type: 'DECKCRAFT_READY' }, '*');
} catch(e) {}

// Ouvinte de mensagens da Central Multimídia para carregar arquivos PPTX automaticamente
window.addEventListener('message', async (e) => {
  if (!e.data) return;
  if (e.data.type === 'LOAD_PPTX_BLOB' || e.data.type === 'LOAD_PPTX') {
    try {
      const { blob, buffer, name } = e.data;
      const fileData = blob || (buffer ? new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' }) : null);
      if (!fileData) return;
      const file = new File([fileData], name || 'slides_culto.pptx', {
        type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
      });
      const dt = new DataTransfer();
      dt.items.add(file);
      const canvas = document.getElementById('deckcraft_canvas');
      if (canvas) {
        const dropEvt = new DragEvent('drop', {
          bubbles: true,
          cancelable: true,
          dataTransfer: dt
        });
        canvas.dispatchEvent(dropEvt);
        console.log('[DeckCraft] Evento drop de PPTX disparado:', file.name);
      }
    } catch (err) {
      console.warn('[DeckCraft] Falha ao injetar evento de arquivo:', err);
    }
  }
});

// Suporte para arrastar e soltar arquivo em qualquer lugar da tela com feedback visual
let dragCounter = 0;
window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCounter++;
  const overlay = document.getElementById('deckcraft_drop_overlay');
  if (overlay) overlay.style.display = 'flex';
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    const overlay = document.getElementById('deckcraft_drop_overlay');
    if (overlay) overlay.style.display = 'none';
  }
});
window.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('drop', (e) => {
  dragCounter = 0;
  const overlay = document.getElementById('deckcraft_drop_overlay');
  if (overlay) overlay.style.display = 'none';

  const canvas = document.getElementById('deckcraft_canvas');
  if (e.target !== canvas && canvas && e.dataTransfer && e.dataTransfer.files.length > 0) {
    e.preventDefault();
    const dropEvt = new DragEvent('drop', {
      bubbles: true,
      cancelable: true,
      dataTransfer: e.dataTransfer
    });
    canvas.dispatchEvent(dropEvt);
  }
});
</script>

  <style>

    #deckcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #deckcraft_drop_overlay {
      display: none; position: absolute; inset: 16px; border: 3px dashed #6366f1; border-radius: 14px;
      background: rgba(15, 23, 42, 0.88); z-index: 999; pointer-events: none; align-items: center; justify-content: center;
      color: #ffffff; font: 600 20px system-ui, sans-serif; box-shadow: 0 0 40px rgba(99, 102, 241, 0.5); text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
